{% extends "page_view.html" %}
{% block page.content %}
  <c-mvp.section title="People" icon="people">
    <c-mvp.card tight only>
      <c-list only>
        {% for person in people %}
          <c-list.row class="items-center" only>
            <c-avatar placeholder="{{ person.first_name|make_list|first|upper }}" class="shrink-0" content_class="size-10 rounded-full bg-neutral text-neutral-content" only />
            <div class="list-col-grow min-w-0 break-words"><c-mvp_community.activity.name :object="person" only /></div>
            <c-mvp_community.activity.follow :object="person" />
          </c-list.row>
        {% endfor %}
      </c-list>
    </c-mvp.card>
  </c-mvp.section>
  <c-mvp.section title="Groups" icon="people">
    <c-mvp.card tight only>
      <c-list only>
        {% for group in groups %}
          <c-list.row class="items-center" only>
            <c-avatar placeholder="{{ group.name|make_list|first|upper }}" class="shrink-0" content_class="size-10 rounded-box bg-secondary text-secondary-content" only />
            <div class="list-col-grow min-w-0 break-words"><c-mvp_community.activity.name :object="group" only /></div>
            <c-mvp_community.activity.follow :object="group" />
          </c-list.row>
        {% endfor %}
      </c-list>
    </c-mvp.card>
  </c-mvp.section>
{% endblock page.content %}
